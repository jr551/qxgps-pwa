# Draft F-Droid metadata — Tauri v2 Android build from source.
# Application id is final (io.github.jr551.qxgps) and matches this filename.

Categories:
  - Navigation
License: MIT
AuthorName: qxgps-pwa contributors
SourceCode: https://github.com/jr551/qxgps-pwa
IssueTracker: https://github.com/jr551/qxgps-pwa/issues
Changelog: https://github.com/jr551/qxgps-pwa/blob/main/CHANGELOG.md

AutoName: QXGPS Lite
Summary: Ad-free read-only client for QXGPS GPS trackers you own
Description: |
  Unofficial viewer for QXGPS / QXHL cloud trackers. Tauri v2 shell around the
  MIT-licensed PWA — no ads or proprietary analytics. Read-only toward the vendor API.

  Requires your own vendor account. Not affiliated with the device maker.

WebSite: https://github.com/jr551/qxgps-pwa

# Toolchain pins (see docs/android-tauri.md):
#   Rust 1.90.0, NDK r27c (27.2.12479018), @tauri-apps/cli 2.12.2, JDK 17

Builds:
  - versionName: '0.2.1'
    versionCode: 201
    commit: v0.2.1
    subdir: .
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    init:
      - rustup toolchain install 1.90.0 --profile minimal
      - rustup default 1.90.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    prebuild:
      - npm ci
      - sdkmanager "ndk;27.2.12479018" "platforms;android-34"
      - export NDK_HOME=$$ANDROID_NDK_HOME$$
    build:
      - npm run build:android
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

AntiFeatures:
  - NonFreeNet
  # Optional native background monitor uses a foreground service + local notifications
  # (no proprietary push). Users enable it explicitly in Settings.
