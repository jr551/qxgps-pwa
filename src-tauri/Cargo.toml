[package]
name = "qxgps_pwa"
version = "0.2.0"
description = "Ad-free read-only QXGPS tracker client (Tauri shell)"
authors = ["qxgps-pwa contributors"]
license = "MIT"
repository = "https://github.com/PLACEHOLDER/qxgps-pwa"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qxgps_pwa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.3", features = [] }
