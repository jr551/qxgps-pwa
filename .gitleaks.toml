title = "qxgps-pwa gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Sample device identifiers and neutral demo coordinates in docs and tests"
paths = [
  'docs/screenshots/.*',
  'src/.*\.test\.ts',
]
regexes = [
  '8900000000000000000\d',
  '1000000000\d+',
  'you@example\.com',
]
